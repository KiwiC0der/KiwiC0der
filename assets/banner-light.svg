<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title">
<title id="title">Terminal banner: a dithered avatar beside whoami output reading Anteneh Demissie, cybersecurity student and aspiring pentester</title>
<style>
  .t { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  .sm { font-size: 20px; }
  .xl { font-size: 46px; font-weight: 700; letter-spacing: -0.5px; }
  .type { clip-path: inset(0 100% 0 0); }
  .fade { opacity: 0; }
  .cursor { fill-opacity: 0; animation: blink 1.1s steps(1, end) infinite backwards; }
  .avatar { opacity: 0; animation: fade .7s ease-out .1s forwards; }
  @keyframes type { to { clip-path: inset(0 0 0 0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 0%, 49% { fill-opacity: 0; } 50%, 100% { fill-opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .type { clip-path: none; animation: none !important; }
    .fade, .avatar { opacity: 1; animation: none !important; }
    .cursor { fill-opacity: 1; animation: none !important; }
  }
</style>
<defs>
  <clipPath id="avatarClip"><rect x="30" y="30" width="240" height="240" rx="10"/></clipPath>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000"/></pattern>
  
</defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<g class="avatar" clip-path="url(#avatarClip)">
  <image x="30" y="30" width="240" height="240" preserveAspectRatio="xMidYMid slice" style="image-rendering: pixelated" href="data:image/png;base64,"/>
</g>

<text x="312" y="74" class="t sm type" style="animation: type 1.35s steps(27) 0.35s forwards"><tspan fill="#1a7f37">kiwic0der@anteneh:~$</tspan> <tspan fill="#1f2328">whoami</tspan></text>
<text x="312" y="132" class="t xl type" style="animation: type 0.60s steps(16) 1.95s forwards" fill="#1f2328">Anteneh Demissie</text>
<text x="312" y="178" class="t sm type" style="animation: type 0.76s steps(42) 2.75s forwards" fill="#59636e">cybersecurity student · aspiring pentester</text>
<text x="312" y="212" class="t sm type" style="animation: type 1.01s steps(56) 3.71s forwards" fill="#59636e">immersive 3D web · local-first browser tools · AI agents</text>
<text x="312" y="276" class="t sm fade" style="animation: fade .01s 4.91s forwards"><tspan fill="#1a7f37">kiwic0der@anteneh:~$</tspan> <tspan class="cursor" fill="#1a7f37" style="animation-delay: 4.91s">▌</tspan></text>
</svg>
